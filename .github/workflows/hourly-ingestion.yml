name: Hourly Open-Meteo ingestion check
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hourly-weather-ingestion
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.32,<3" "pandas>=2.2,<3" "tzdata>=2024.1"
      - run: python -m scripts.mlops_check ingestion --output outputs/mlops/ingestion.json
